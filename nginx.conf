# ==============================================================================
# CIC Alumni 1995 Set — Nginx Server Block with Core Security Headers & Caching
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alumni1995.cic-enugu.org;

    root /var/www/cic-alumni;
    index index.html;

    # ==========================================================================
    # CORE SECURITY HEADERS
    # ==========================================================================

    # 1. Content Security Policy (CSP - Hardened)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https: wss:; frame-src 'self' https://checkout.paystack.com https://*.paystack.co https://*.flutterwave.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https:; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests;" always;

    # 2. Clickjacking Protection
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 3. MIME Sniffing Protection
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Strict Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Restrict Unused Hardware & Browser Features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # 6. HTTP Strict Transport Security (HSTS - 1 Year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 7. XSS Filter Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # 8. Cross-Origin Policies
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Security: Hide Server Tokens
    server_tokens off;

    # ==========================================================================
    # GZIP COMPRESSION (Core Web Vitals PageSpeed Optimization)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # ==========================================================================
    # STATIC ASSET CACHING (1 Year Immutable for Images & Fonts)
    # ==========================================================================
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # CSS & JS: 7 Days with Stale While Revalidate
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
